<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My App - Download APK</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #0f172a; color: #ffffff; padding: 40px 20px; margin: 0; }
    .container { max-width: 600px; margin: 0 auto; }
    .app-icon { width: 100px; height: 100px; border-radius: 22px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-bottom: 20px; }
    h1 { font-size: 32px; margin-bottom: 10px; }
    p { color: #94a3b8; font-size: 16px; line-height: 1.6; margin-bottom: 30px; }
    .download-btn { background: #22c55e; color: white; padding: 16px 35px; font-size: 18px; font-weight: bold; text-decoration: none; border-radius: 30px; display: inline-block; box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4); transition: 0.2s; }
    .download-btn:hover { background: #16a34a; }
    .info { margin-top: 20px; font-size: 14px; color: #64748b; }
    .screenshots { display: flex; justify-content: center; gap: 15px; margin-top: 40px; flex-wrap: wrap; }
    .screenshots img { width: 160px; border-radius: 12px; border: 2px solid #334155; }
  </style>
</head>
<body>

  <div class="container">
    <!-- App Logo (Yahan apni app ke icon ka link daal sakte hain) -->
    <img src="https://via.placeholder.com/100" class="app-icon" alt="App Logo">
    
    <h1>Meri Behtareen App</h1>
    <p>Aapki rozmarra ki zaroorat ko asaan banane wali zabardast Android application. Play Store par aane se pehle abhi download karein!</p>

    <!-- Download APK Button (Yahan apna Google Drive ya MediaFire ka APK link daal dein) -->
    <a href="YOUR_APK_DIRECT_LINK_HERE" class="download-btn">📥 Download APK (v1.0)</a>
    
    <div class="info">Size: 15 MB • Android 8.0 & above</div>

    <!-- Screenshots Section -->
    <div class="screenshots">
      <img src="https://via.placeholder.com/160x320" alt="Screen 1">
      <img src="https://via.placeholder.com/160x320" alt="Screen 2">
    </div>
  </div>

</body>
</html>
